name: Feature request
description: Предложить улучшение EasyMonitoring
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу, а не только готовое решение. Это поможет выбрать подходящий вариант реализации.

  - type: textarea
    id: problem
    attributes:
      label: Какую проблему это решает?
      description: Что сейчас неудобно или чего не хватает?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Какие ещё варианты вы рассматривали?

  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Трей и анимация
        - CPU
        - GPU
        - RAM
        - Меню и тема
        - Автозапуск
        - Сборка и релизы
        - Другое
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил существующие issues и не нашёл дубликат
          required: true
