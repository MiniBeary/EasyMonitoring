name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore EasyMonitoring.sln

      - name: Test
        run: dotnet test EasyMonitoring.sln -c Release --no-restore

      - name: Publish single-file exe
        run: >
          dotnet publish src/EasyMonitoring.App
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/publish

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item artifacts/publish/EasyMonitoring.exe artifacts/publish/EasyMonitoring-win-x64.exe
          $hash = (Get-FileHash artifacts/publish/EasyMonitoring-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EasyMonitoring-win-x64.exe" | Set-Content -Encoding ascii artifacts/publish/SHA256SUMS.txt
          Get-Content artifacts/publish/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          artifacts/publish/EasyMonitoring-win-x64.exe
          artifacts/publish/SHA256SUMS.txt
          --title "EasyMonitoring ${{ github.ref_name }}"
          --notes-file docs/release-notes.md
          --verify-tag
